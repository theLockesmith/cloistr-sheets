variables:
  NODE_VERSION: "22"

stages:
  - test
  - build
  - smoke

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/frontend-smoke.yml'

# Type-check and unit tests. The smoke gate only proves the page renders without
# console errors — a spreadsheet whose edits never reach the CRDT passes it
# cleanly, which is exactly how the missing Yjs bridge went unnoticed for so
# long: the app looked fine and silently saved nothing.
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  # `npm ci` is the whole cost of this job; the suite itself runs in
  # milliseconds. node_modules is cached on the ref, so the ceiling only matters
  # until the first green run populates it.
  timeout: 25 minutes
  variables:
    CI: "true"
    # A registry blip should retry rather than stall the install until the job
    # clock runs out.
    NPM_CONFIG_FETCH_RETRIES: "5"
    NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
  before_script:
    # Auth must match the registry line in .npmrc by URI prefix or npm ignores it.
    - echo "//git.aegis-hq.xyz/api/v4/groups/9/-/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npx tsc --noEmit
    - npm test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

build:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_EXTRA_FLAGS: "--build-arg=NPM_TOKEN=${CI_JOB_TOKEN}"

# Smoke-test gate: load built image in real Chromium (with crypto.randomUUID polyfill)
smoke-test:
  extends: .smoke-test
  needs: ["build"]
